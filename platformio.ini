; =====================================================================
;  HUD-Moto firmware v1  -  PlatformIO project
;  Ambienti:
;    esp32dev        -> ESP32 DevKit classico (WROOM-32), SDA 21 / SCL 22
;    xiao_esp32c3    -> Seeed XIAO ESP32-C3,              SDA 6  / SCL 7
;  Compilare:  pio run            (entrambi)
;              pio run -e esp32dev -t upload
; =====================================================================

[platformio]
default_envs = esp32dev, xiao_esp32c3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    fbiego/ChronosESP32@^1.9.1
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.1
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
board = esp32dev
; BLE (NimBLE) + GFX stanno larghi nella partizione di default (1.2 MB app)
build_flags =
    ${env.build_flags}
    -DHUD_BOARD_ESP32DEV

[env:xiao_esp32c3]
board = seeed_xiao_esp32c3
build_flags =
    ${env.build_flags}
    -DHUD_BOARD_XIAO_C3
    ; Serial su USB nativa (CDC) per il monitor seriale
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
